- date: '2026-06'
  highlights:
  - S3-compatible API supports appends via AppendObject for log-style files (up to 1 MiB per call).
  - Python and TypeScript SDKs gained large-object and bulk write operations with automatic multipart uploads.
  - S3-compatible API supports writes via PutObject and DeleteObject.
  - Python SDK (`archil` on PyPI) launched with control-plane functionality and S3-compatible object API.
  - Parallel search launched for disk.grep across directories.
  - Branches & checkpoints became generally available in all AWS regions.
