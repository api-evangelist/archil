name: Archil
description: >-
  Archil is the cloud filesystem for AI. It turns an existing object-storage
  bucket (Amazon S3, Google Cloud Storage, Cloudflare R2, Azure Blob, MinIO,
  Wasabi, Backblaze B2, DigitalOcean Spaces) into an unlimited, POSIX-compatible
  local disk that thousands of machines can mount at once — live, in place, and
  faster than local disk. A single multi-tenant "disk" caches active data in a
  high-speed layer, supports copy-on-write branches and checkpoints for isolated
  agent and CI fan-out, and can run serverless bash and parallel grep directly
  against the data with no separate sandbox. Archil exposes a REST Control Plane
  API for managing disks, disk users, API tokens, and serverless execution, plus
  first-party TypeScript and Python SDKs, a `disk` CLI, a Linux `archil` mount
  CLI, a Kubernetes CSI driver, a Terraform provider, and an S3-compatible HTTP
  API. Founded 2024, backed by Felicis, Y Combinator, General Catalyst, Peak XV,
  and Standard Capital. Added to the API Evangelist network from the Felicis
  portfolio and enriched by the pipeline.
